name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # RESEND_API_KEY isn't used for anything at build time (next build
      # never sends mail) but lib/email.ts constructs `new Resend(...)`
      # eagerly at module load, which throws if unset — confirmed locally
      # that build fails without it. A placeholder is sufficient.
      - name: Build
        env:
          RESEND_API_KEY: build-placeholder-not-a-real-key
        run: npm run build

      - name: Test
        run: npm test

  # Only runs after `checks` passes on a push to main (never for PRs — a
  # PR hasn't merged, so there's nothing to deploy). Auto-deploys staging;
  # production stays manual (npm run deploy), unchanged by this workflow.
  deploy-staging:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # ENV_STAGING_FILE is the whole contents of .env.staging (deploy-time
      # secrets pushed to the Worker + NEXT_PUBLIC_* vars inlined at build
      # time) — same whole-file-blob pattern already used for
      # .env.staging-test in staging-tests.yml.
      - name: Write .env.staging
        env:
          ENV_STAGING_FILE: ${{ secrets.ENV_STAGING_FILE }}
        run: printf '%s\n' "$ENV_STAGING_FILE" > .env.staging

      - name: Push Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run secrets:staging

      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:staging

      - name: Trigger staging tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run staging-tests.yml
